<g font-size="11" fill="#333"><text x="20" y="702" font-size="15" font-weight="bold">PR-512  SUPPORT ROOMS — v0.5 TREATMENT (existing middle-zone rooms only; partitions scan-inferred, unchanged)</text>
<text x="20" y="720">Vocal booth reuses the Clark vocal-booth set (DIF-004, BTR-003, ABS-015/016, PAN-002) plus Sunny ABS-001/008/011 and GOB-005 ×2; amp booth and machine room take Sunny panels.</text>
<text x="20" y="736">v0.5 ACOUSTIC INTEGRATION on the approved v0.4 layout and the provisional existing shell (scan + photos, about ±0.1–0.2 m). NOT FOR CONSTRUCTION. Acoustician review and on-site measurement required.</text>

<g font-size="11" fill="#333"><text x="20" y="810" font-size="15" font-weight="bold">PR-502  CONTROL ROOM — REFLECTED CEILING PLAN v0.5 (looking up; plan orientation as PR-501)</text>
<text x="20" y="828">Cloud = GOB-004 + GOB-003 hung 200 mm below the flat ceiling; GOB-003 on each slope on 50 mm stand-offs. Dots = first-reflection points (green treated, red open).</text>
<text x="20" y="844">v0.5 ACOUSTIC INTEGRATION on the approved v0.4 layout and the provisional existing shell (scan + photos, about ±0.1–0.2 m). NOT FOR CONSTRUCTION. Acoustician review and on-site measurement required.</text>

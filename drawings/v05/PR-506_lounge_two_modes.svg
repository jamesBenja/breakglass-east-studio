<text x="1076.6" y="83.8" font-size="13" text-anchor="middle" fill="#8a5a2b" font-weight="bold">CINEMA MODE — sofa + 2 swivel armchairs (5–6 seats, as v0.4)</text><text x="20" y="678" font-size="10" fill="#444">Honest limit: the lounge sits behind the drop-down screen; it is a fireside / listen-back spot, not a cinema seat. No mechanisms: armchair A is a swivel chair on felt glides.</text><text x="20" y="663" font-size="10" fill="#444">Tested: a third seat (second armchair) does not fit around the fire behind the speaker line with these clearances, so armchair B lives in the rear row in both modes.</text><text x="20" y="648" font-size="10" fill="#444">Checks: minimum stove clearance 0.92 m (≥ 0.90 m placeholder); doorway route clear; lounge furniture ≤ 0.80 m high, below the RL 901K acoustic centre (1.278 m); nothing between the LP and either speaker.</text>
<g font-size="11" fill="#333"><text x="20" y="708" font-size="15" font-weight="bold">PR-506  FIRESIDE LOUNGE — CORRECTED (owner-authorised): seats now face the existing wood stove; two simple furniture modes</text>
<text x="20" y="726">Grey dashed = kept-clear zones (speaker + cardioid clear zone, sub, bench/corner traps, front frames, future Ls stand); yellow = doorway route to the live room; hearth pad hatched.</text>
<text x="20" y="742">v0.5 ACOUSTIC INTEGRATION on the approved v0.4 layout and the provisional existing shell (scan + photos, about ±0.1–0.2 m). NOT FOR CONSTRUCTION. Acoustician review and on-site measurement required.</text>
